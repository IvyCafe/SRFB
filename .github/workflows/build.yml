name: Build for Alice Novel

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack files into anproj-format
        run: |
          cd src
          zip -r ../ddm-${{ github.sha }}.zip ./
          mv ../ddm-${{ github.sha }}.zip ../ddm-${{ github.sha }}.anproj
      
      # Upload Artifact
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddm
          path: ddm-*.anproj
